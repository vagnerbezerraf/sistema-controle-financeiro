name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
            rust-targets: ''
            bundle-dir: apps/desktop/src-tauri/target/release/bundle
          - name: macos
            os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build do bundle
        shell: bash
        run: >
          pnpm --filter @scf/desktop exec tauri build
          --bundles "${{ matrix.bundles }}"
          ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Somatorio de verificacao (SHA-256)
        shell: bash
        run: |
          cd "${{ matrix.bundle-dir }}"
          : > SHA256SUMS.txt
          for f in $(find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \)); do
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: scf-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/macos/*.app
            ${{ matrix.bundle-dir }}/SHA256SUMS.txt
