appId: host.exp.exponent
---
- openLink: "exp://10.0.2.2:8081"
- runFlow: scripts/ensure-logged-in.yaml

# Abre a aba de cartoes e cria um cartao
- tapOn:
    id: "tab-cartoes"
- extendedWaitUntil:
    visible: "Compras por ciclo de fechamento."
    timeout: 20000
- assertVisible: "Cartoes e faturas"

- tapOn:
    id: "novo-cartao"
- tapOn:
    id: "cartao-nome"
- inputText: "Cartao E2E"
- hideKeyboard
- tapOn:
    id: "cartao-salvar"

# O cartao recem-criado aparece na lista
- extendedWaitUntil:
    visible: "Cartao E2E"
    timeout: 20000

# Lanca uma compra parcelada; cada parcela cai na fatura da sua competencia
- tapOn:
    id: "nova-compra"
- tapOn:
    id: "compra-descricao"
- inputText: "Notebook E2E"
- hideKeyboard
- tapOn:
    id: "compra-valor"
- inputText: "3000.00"
- hideKeyboard
- tapOn:
    id: "compra-parcelas"
- eraseText
- inputText: "3"
- hideKeyboard
- tapOn:
    id: "compra-salvar"

# As faturas geradas mostram o valor de cada parcela (R$ 1000,00)
- extendedWaitUntil:
    visible: ".*1000,00.*"
    timeout: 20000

- tapOn:
    id: "tab-dashboard"
- extendedWaitUntil:
    visible: "Resumo do mes atual."
    timeout: 20000
