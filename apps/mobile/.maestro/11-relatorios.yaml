appId: host.exp.exponent
---
- openLink: "exp://10.0.2.2:8081"
- runFlow: scripts/ensure-logged-in.yaml

# Abre a aba de relatorios assincronos
- tapOn:
    id: "tab-relatorios"
- extendedWaitUntil:
    visible: ".*Solicite a exportacao de lancamentos.*"
    timeout: 20000
- assertVisible: "Relatorios assincronos"

# Solicita um relatorio no periodo informado
- tapOn:
    id: "relatorio-novo"
- tapOn:
    id: "relatorio-de"
- inputText: "2026-01-01"
- tapOn:
    id: "relatorio-ate"
- inputText: "2026-01-31"
- hideKeyboard
- tapOn:
    id: "relatorio-criar"

# O relatorio recem-criado aparece na lista enquanto pendente
- extendedWaitUntil:
    visible: "Exportacao de lancamentos (CSV)"
    timeout: 20000
- assertVisible: "Pendente"

- tapOn:
    id: "tab-dashboard"
- extendedWaitUntil:
    visible: "Resumo do mes atual."
    timeout: 20000
